<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Twice Shy demo</title>
<style>
	:root {
		--bg: #0d1017; --panel: #131722; --text: #d7dce5; --dim: #6b7385; --green: #4ade80;
		--red: #f87171; --yellow: #fbbf24; --cyan: #67e8f9; --violet: #c4b5fd; --accent: #f472b6;
	}
	* { box-sizing: border-box; }
	html, body { margin: 0; background: #07090d; }
	body { width: 1200px; height: 720px; display: grid; place-items: center; font-family: "Cascadia Code", "JetBrains Mono", Consolas, monospace; }
	.window { width: 1140px; height: 670px; background: var(--panel); border-radius: 14px; overflow: hidden;
		box-shadow: 0 30px 80px rgba(0,0,0,.6), 0 0 0 1px rgba(255,255,255,.06); display: flex; flex-direction: column; }
	.bar { height: 40px; display: flex; align-items: center; padding: 0 16px; gap: 8px; background: #0f131c; border-bottom: 1px solid rgba(255,255,255,.05); }
	.dot { width: 12px; height: 12px; border-radius: 50%; }
	.title { flex: 1; text-align: center; color: var(--dim); font-size: 13px; margin-right: 52px; }
	.badge { position: absolute; }
	.screen { flex: 1; padding: 18px 24px; overflow: hidden; position: relative; }
	.content { position: absolute; left: 24px; right: 24px; bottom: 18px; }
	.line { white-space: pre-wrap; font-size: 16px; line-height: 1.5; color: var(--text); min-height: 1.5em; }
	.dim { color: var(--dim); } .green { color: var(--green); } .red { color: var(--red); } .yellow { color: var(--yellow); }
	.cyan { color: var(--cyan); } .violet { color: var(--violet); } .accent { color: var(--accent); } .bold { font-weight: 700; }
	.prompt::before { content: "❯ "; color: var(--accent); font-weight: 700; }
	.user { color: #fff; font-weight: 600; }
	.box { border-left: 3px solid var(--red); padding-left: 14px; margin: 4px 0; background: rgba(248,113,113,.06); }
	.okbox { border-left: 3px solid var(--green); padding-left: 14px; margin: 4px 0; background: rgba(74,222,128,.07); }
	.cursor { display: inline-block; width: 9px; height: 1.1em; background: var(--text); vertical-align: text-bottom; margin-left: 2px; }
	.caption { position: absolute; top: 14px; right: 18px; font-family: system-ui, "Segoe UI", sans-serif; font-size: 14px;
		color: #0d1017; background: var(--green); padding: 6px 12px; border-radius: 999px; font-weight: 700; opacity: 0; transition: none; }
	.logo { font-family: system-ui, "Segoe UI", sans-serif; }
</style>
</head>
<body>
<div class="window">
	<div class="bar">
		<span class="dot" style="background:#ff5f57"></span><span class="dot" style="background:#febc2e"></span><span class="dot" style="background:#28c840"></span>
		<span class="title" id="title">~/shop</span>
	</div>
	<div class="screen"><div class="content" id="content"></div><div class="caption" id="caption"></div></div>
</div>
<script>
	// Le scénario est injecté par capture.mjs : window.SCRIPT = [{ at, type, text, cls, speed, block }…]
	// `type` : "type" (tapé caractère par caractère), "line" (apparaît d'un coup),
	// "clear" (efface l'écran), "caption" (bandeau en haut à droite), "title".
	function esc(s) { return s.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;"); }
	window.renderAt = function (t) {
		const script = window.SCRIPT;
		let start = 0;
		for (let i = 0; i < script.length; i++) if (script[i].type === "clear" && script[i].at <= t) start = i + 1;
		let html = "";
		let caption = "";
		let title = document.getElementById("title").dataset.base || "~/shop";
		for (const e of script) if (e.type === "title" && e.at <= t) title = e.text;
		for (const e of script) if (e.type === "caption" && e.at <= t) caption = e.text;
		for (let i = start; i < script.length; i++) {
			const e = script[i];
			if (e.at > t || e.type === "clear" || e.type === "caption" || e.type === "title") continue;
			let text = e.text;
			let typing = false;
			if (e.type === "type") {
				const n = Math.floor((t - e.at) * (e.speed || 28));
				typing = n < text.length;
				text = text.slice(0, Math.max(0, n));
			}
			const body = e.html ? text : esc(text);
			html += `<div class="line ${e.cls || ""}">${body}${typing ? '<span class="cursor"></span>' : ""}</div>`;
		}
		document.getElementById("content").innerHTML = html;
		document.getElementById("title").textContent = title;
		const cap = document.getElementById("caption");
		cap.textContent = caption;
		cap.style.opacity = caption ? 1 : 0;
	};
</script>
</body>
</html>
